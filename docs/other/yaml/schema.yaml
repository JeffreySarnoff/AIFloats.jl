$schema: https://json-schema.org/draft/2020-12/schema
title: Lossless P3109 Maude source document
description: Structural schema; realize.py also checks text/field agreement.
oneOf:
- type: object
  additionalProperties: false
  required:
  - version
  - path
  - sha256
  - type
  - records
  properties:
    version: &id011
      const: 1
    path: &id012
      type: string
      pattern: ^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$
    sha256: &id013
      type: string
      pattern: ^[0-9a-f]{64}$
    type:
      const: maude
    records:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - line
        - kind
        - fields
        - text
        properties:
          line:
            type: integer
            minimum: 1
          kind:
            enum:
            - layout
            - comment
            - fmod
            - fth
            - view
            - endfm
            - endfth
            - endv
            - quit
            - load
            - sload
            - including
            - protecting
            - extending
            - sort
            - sorts
            - subsort
            - subsorts
            - var
            - vars
            - op
            - ops
            - op-mapping
            - eq
            - ceq
            - mb
            - cmb
            - red
            - set
          fields:
            type: object
          text: &id002
            type: string
        allOf:
        - if:
            properties:
              kind:
                const: layout
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required: []
                properties: &id001 {}
        - if:
            properties:
              kind:
                const: comment
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required: []
                properties: *id001
        - if:
            properties:
              kind:
                const: endfm
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required: []
                properties: *id001
        - if:
            properties:
              kind:
                const: endfth
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required: []
                properties: *id001
        - if:
            properties:
              kind:
                const: endv
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required: []
                properties: *id001
        - if:
            properties:
              kind:
                const: quit
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required: []
                properties: *id001
        - if:
            properties:
              kind:
                const: fmod
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - name
                - parameters
                properties: &id003
                  name: *id002
                  parameters:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - name
                      - theory
                      properties:
                        name: *id002
                        theory: *id002
        - if:
            properties:
              kind:
                const: fth
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - name
                - parameters
                properties: *id003
        - if:
            properties:
              kind:
                const: view
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - name
                - from
                - to
                properties:
                  name: *id002
                  from: *id002
                  to: *id002
        - if:
            properties:
              kind:
                const: load
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - path
                properties: &id004
                  path: *id002
        - if:
            properties:
              kind:
                const: sload
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - path
                properties: *id004
        - if:
            properties:
              kind:
                const: including
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - expression
                properties: &id005
                  expression: *id002
        - if:
            properties:
              kind:
                const: protecting
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - expression
                properties: *id005
        - if:
            properties:
              kind:
                const: extending
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - expression
                properties: *id005
        - if:
            properties:
              kind:
                const: sort
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - names
                properties: &id006
                  names: &id007
                    type: array
                    items: *id002
        - if:
            properties:
              kind:
                const: sorts
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - names
                properties: *id006
        - if:
            properties:
              kind:
                const: subsort
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - chain
                properties: &id008
                  chain:
                    type: array
                    items: *id007
        - if:
            properties:
              kind:
                const: subsorts
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - chain
                properties: *id008
        - if:
            properties:
              kind:
                const: var
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - names
                - sort
                properties: &id009
                  names: *id007
                  sort: *id002
        - if:
            properties:
              kind:
                const: vars
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - names
                - sort
                properties: *id009
        - if:
            properties:
              kind:
                const: op
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - names
                - domain
                - arrow
                - range
                - attributes
                properties: &id010
                  names: *id007
                  domain: *id007
                  arrow:
                    enum:
                    - ->
                    - ~>
                  range: *id002
                  attributes: *id002
        - if:
            properties:
              kind:
                const: ops
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - names
                - domain
                - arrow
                - range
                - attributes
                properties: *id010
        - if:
            properties:
              kind:
                const: op-mapping
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - from
                - to
                properties:
                  from: *id002
                  to: *id002
        - if:
            properties:
              kind:
                const: eq
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - label
                - lhs
                - rhs
                - condition
                - attributes
                properties:
                  label: *id002
                  lhs: *id002
                  rhs: *id002
                  condition:
                    type: 'null'
                  attributes: *id002
        - if:
            properties:
              kind:
                const: ceq
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - label
                - lhs
                - rhs
                - condition
                - attributes
                properties:
                  label: *id002
                  lhs: *id002
                  rhs: *id002
                  condition: *id002
                  attributes: *id002
        - if:
            properties:
              kind:
                const: mb
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - label
                - lhs
                - sort
                - condition
                - attributes
                properties:
                  label: *id002
                  lhs: *id002
                  sort: *id002
                  condition:
                    type: 'null'
                  attributes: *id002
        - if:
            properties:
              kind:
                const: cmb
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - label
                - lhs
                - sort
                - condition
                - attributes
                properties:
                  label: *id002
                  lhs: *id002
                  sort: *id002
                  condition: *id002
                  attributes: *id002
        - if:
            properties:
              kind:
                const: red
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - module
                - term
                properties:
                  module: *id002
                  term: *id002
        - if:
            properties:
              kind:
                const: set
          then:
            properties:
              fields:
                type: object
                additionalProperties: false
                required:
                - option
                - value
                properties:
                  option:
                    const: include BOOL
                  value:
                    enum:
                    - 'on'
                    - 'off'
- type: object
  additionalProperties: false
  required:
  - version
  - path
  - sha256
  - type
  - format
  - text
  - data
  properties:
    version: *id011
    path: *id012
    sha256: *id013
    type:
      const: support
    format:
      enum:
      - json
      - tsv
    text: *id002
    data: {}
